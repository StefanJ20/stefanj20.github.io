        <circle cx="740" cy="180" r="8"/>
        <circle cx="1100" cy="280" r="8"/>
        <circle cx="315" cy="585" r="8"/>
        <circle cx="700" cy="695" r="8"/>
        <circle cx="1080" cy="575" r="8"/>
    </g>
</svg>
