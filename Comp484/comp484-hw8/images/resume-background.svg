        <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
            <path d="M80 0H0V80" fill="none" stroke="#EAF2FF" stroke-opacity="0.16" stroke-width="1"/>
            <circle cx="0" cy="0" r="4" fill="#F59E0B" fill-opacity="0.55"/>
        </pattern>
    </defs>
    <rect width="1600" height="900" fill="url(#base)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3">
        <path d="M0 190H260L340 270H650L740 180H1000L1100 280H1600"/>
        <path d="M0 690H210L315 585H590L700 695H960L1080 575H1320L1440 695H1600"/>
