<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
    <title id="title">Abstract technology background</title>
    <desc id="description">A dark blue geometric circuit pattern used behind the education section.</desc>
    <defs>
        <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#102A43"/>
