<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Average Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Grade Average Calculator</h1>
        <p class="intro">
            Enter values to test number conversion and calculate a grade average.
        </p>

        <section class="card">
            <h2>Date Display</h2>
            <p id="dateOutput">Date will appear here.</p>
        </section>

        <section class="card">
            <h2>Number Conversion Tests</h2>

            <label for="firstValue">First value:</label>
            <input type="text" id="firstValue" value="88">

            <label for="secondValue">Second value:</label>
            <input type="text" id="secondValue" value="94.5">

            <label for="thirdValue">Third value:</label>
            <input type="text" id="thirdValue" value="79">

            <label for="fourthValue">Fourth value:</label>
            <input type="text" id="fourthValue" value="missing">

            <div id="numberConversionOutput">
                Results will appear here.
            </div>
        </section>

        <section class="card">
            <h2>Grade Average and Number Formatting</h2>

            <label for="gradeOne">Grade 1:</label>
            <input type="number" id="gradeOne" value="88" min="0" max="100" step="0.1">

            <label for="gradeTwo">Grade 2:</label>
            <input type="number" id="gradeTwo" value="94.5" min="0" max="100" step="0.1">

            <label for="gradeThree">Grade 3:</label>
            <input type="number" id="gradeThree" value="79" min="0" max="100" step="0.1">

            <button id="calculateButton">Calculate Grades</button>

            <div id="mathOutput">
                Results will appear here.
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
